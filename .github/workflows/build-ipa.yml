name: Build iOS IPA & Deploy

on:
  workflow_dispatch:
    inputs:
      auto_fix_attempt:
        description: 'Auto-fix attempt counter'
        required: false
        default: '0'
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'README.md'
      - '.gitignore'

jobs:
  build-ipa:
    name: Build & Package IPA
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select Xcode Version
        run: |
          echo "Available Xcode versions:"
          ls -d /Applications/Xcode*.app || true
          sudo xcode-select -s /Applications/Xcode_15.4.app 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode_15.3.app 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install Apple Certificate (.p12)
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "::error::BUILD_CERTIFICATE_BASE64 secret is missing! Please configure secrets."
            exit 1
          fi

          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PWD="${KEYCHAIN_PASSWORD:-buildpassword123}"

          # Decode p12
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          # Create and configure keychain
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"

          # Set as default keychain and update search list
          EXISTING_KEYCHAINS=$(security list-keychains -d user | tr -d '"' || true)
          security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING_KEYCHAINS
          security default-keychain -s "$KEYCHAIN_PATH"

          # Download and install Apple Root and WWDR Intermediate Certificates
          echo "Installing Apple Worldwide Developer Relations intermediate certs..."
          curl -fsSL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o "$RUNNER_TEMP/AppleWWDRCAG3.cer" || true
          security import "$RUNNER_TEMP/AppleWWDRCAG3.cer" -k "$KEYCHAIN_PATH" -A || true
          curl -fsSL https://www.apple.com/certificateauthority/AppleWWDRCAG4.cer -o "$RUNNER_TEMP/AppleWWDRCAG4.cer" || true
          security import "$RUNNER_TEMP/AppleWWDRCAG4.cer" -k "$KEYCHAIN_PATH" -A || true
          curl -fsSL https://www.apple.com/certificateauthority/AppleWWDRCAG6.cer -o "$RUNNER_TEMP/AppleWWDRCAG6.cer" || true
          security import "$RUNNER_TEMP/AppleWWDRCAG6.cer" -k "$KEYCHAIN_PATH" -A || true
          curl -fsSL https://www.apple.com/certificateauthority/AppleIncRootCertificate.cer -o "$RUNNER_TEMP/AppleIncRootCertificate.cer" || true
          security import "$RUNNER_TEMP/AppleIncRootCertificate.cer" -k "$KEYCHAIN_PATH" -A || true

          # Import developer certificate
          security import "$CERTIFICATE_PATH" -P "${P12_PASSWORD:-1}" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"

          echo "Certificates in keychain:"
          security find-identity -p codesigning "$KEYCHAIN_PATH" || true

          # Extract Code Sign Identity Name
          CERT_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | head -n 1 | awk -F '"' '{print $2}' || true)
          if [ -z "$CERT_IDENTITY" ]; then
            CERT_IDENTITY=$(security find-identity -p codesigning "$KEYCHAIN_PATH" | head -n 1 | awk -F '"' '{print $2}' || true)
          fi
          if [ -z "$CERT_IDENTITY" ]; then
            CERT_IDENTITY="Apple Distribution"
          fi
          echo "Selected Code Signing Identity: $CERT_IDENTITY"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "KEYCHAIN_PWD=$KEYCHAIN_PWD" >> $GITHUB_ENV
          echo "CODE_SIGN_IDENTITY=$CERT_IDENTITY" >> $GITHUB_ENV

      - name: Install Provisioning Profile (.mobileprovision)
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          if [ -z "$BUILD_PROVISION_PROFILE_BASE64" ]; then
            echo "::error::BUILD_PROVISION_PROFILE_BASE64 secret is missing! Please configure secrets."
            exit 1
          fi

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PROFILE_RAW=$RUNNER_TEMP/profile.mobileprovision
          echo "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$PROFILE_RAW"

          # Extract UUID
          UUID=$(security cms -D -i "$PROFILE_RAW" 2>/dev/null | plutil -extract UUID raw - 2>/dev/null || echo "")
          if [ -z "$UUID" ]; then
            UUID=$(uuidgen || echo "4A9F2E7B-9000-4E38-9844-3F846B7C1234")
          fi
          echo "Provisioning Profile UUID: $UUID"
          cp "$PROFILE_RAW" ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          echo "PROVISIONING_PROFILE_UUID=$UUID" >> $GITHUB_ENV

          # Extract Team ID
          TEAM_ID=$(security cms -D -i "$PROFILE_RAW" 2>/dev/null | plutil -extract TeamIdentifier.0 raw - 2>/dev/null || echo "")
          if [ -z "$TEAM_ID" ]; then
            TEAM_ID="TEAMID1234"
          fi
          echo "DEVELOPMENT_TEAM=$TEAM_ID" >> $GITHUB_ENV
          echo "Team ID: $TEAM_ID"

          # Detect Export Method
          if security cms -D -i "$PROFILE_RAW" 2>/dev/null | grep -q "<key>get-task-allow</key>[[:space:]]*<true/>"; then
            EXPORT_METHOD="development"
          elif security cms -D -i "$PROFILE_RAW" 2>/dev/null | grep -q "<key>ProvisionsAllDevices</key>"; then
            EXPORT_METHOD="enterprise"
          elif security cms -D -i "$PROFILE_RAW" 2>/dev/null | grep -q "<key>ProvisionedDevices</key>"; then
            EXPORT_METHOD="ad-hoc"
          else
            EXPORT_METHOD="app-store"
          fi
          echo "Detected export method: $EXPORT_METHOD"
          echo "EXPORT_METHOD=$EXPORT_METHOD" >> $GITHUB_ENV

      - name: Auto-Sync Bundle Identifier with Provisioning Profile
        run: |
          echo "=== KIỂM TRA VÀ TỰ ĐỘNG ĐỒNG BỘ BUNDLE IDENTIFIER KHỚP VỚI CHỨNG CHỈ ==="
          PROFILE_RAW=$RUNNER_TEMP/profile.mobileprovision
          
          APP_ID=$(security cms -D -i "$PROFILE_RAW" 2>/dev/null | plutil -extract Entitlements.application-identifier raw - 2>/dev/null || echo "")
          echo "Profile Entitlements App ID: $APP_ID"
          
          PROV_BUNDLE_ID=""
          if [[ "$APP_ID" == *"."* ]]; then
            PROV_BUNDLE_ID="${APP_ID#*.}"
          fi

          if [ -n "$PROV_BUNDLE_ID" ] && [ "$PROV_BUNDLE_ID" != "*" ]; then
            echo "Chứng chỉ yêu cầu chính xác Bundle ID: $PROV_BUNDLE_ID"
            APP_BUNDLE_ID="$PROV_BUNDLE_ID"
            find . -name "project.pbxproj" -exec sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = [^;]*;/PRODUCT_BUNDLE_IDENTIFIER = $PROV_BUNDLE_ID;/g" {} + 2>/dev/null || true
            find . -name "Info.plist" -exec plutil -replace CFBundleIdentifier -string "$PROV_BUNDLE_ID" {} + 2>/dev/null || true
          else
            echo "Chứng chỉ là Wildcard (*), lấy Bundle ID hiện tại từ project..."
            DETECTED_BID=$(grep -m 1 "PRODUCT_BUNDLE_IDENTIFIER" $(find . -name "project.pbxproj" | head -n 1) 2>/dev/null | awk -F '=' '{print $2}' | tr -d ' ;"' || echo "")
            if [ -z "$DETECTED_BID" ] || [[ "$DETECTED_BID" == *"$"* ]]; then
              DETECTED_BID="com.example.mysampleapp"
              find . -name "project.pbxproj" -exec sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = [^;]*;/PRODUCT_BUNDLE_IDENTIFIER = $DETECTED_BID;/g" {} + 2>/dev/null || true
            fi
            APP_BUNDLE_ID="$DETECTED_BID"
          fi

          echo "Target Bundle ID: $APP_BUNDLE_ID"
          echo "APP_BUNDLE_ID=$APP_BUNDLE_ID" >> $GITHUB_ENV

      - name: Setup Dependencies (Cocoapods / SPM if needed)
        run: |
          if [ -f "Podfile" ]; then
            echo "Installing CocoaPods..."
            pod install --repo-update || pod install
          fi
          if [ -f "package.json" ]; then
            echo "Node dependencies detected"
            npm ci || npm install
          fi

      - name: Prepare ExportOptions.plist
        run: |
          cat << EOF > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>${EXPORT_METHOD:-ad-hoc}</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>compileBitcode</key>
              <false/>
              <key>thinning</key>
              <string>&lt;none&gt;</string>
              <key>teamID</key>
              <string>${DEVELOPMENT_TEAM}</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>${APP_BUNDLE_ID}</key>
                  <string>${PROVISIONING_PROFILE_UUID}</string>
              </dict>
          </dict>
          </plist>
          EOF
          cat ExportOptions.plist

      - name: Build Archive & Export IPA
        run: |
          mkdir -p build/output

          # Unlock keychain for build steps
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"

          # Locate project or workspace
          WORKSPACE=$(find . -maxdepth 2 -name "*.xcworkspace" | head -n 1)
          PROJECT=$(find . -maxdepth 2 -name "*.xcodeproj" | head -n 1)

          if [ -n "$WORKSPACE" ]; then
            BUILD_TARGET="-workspace $WORKSPACE"
          elif [ -n "$PROJECT" ]; then
            BUILD_TARGET="-project $PROJECT"
          else
            echo "No xcode project found directly, checking for Swift source or payload..."
            if [ -d "Payload" ]; then
              echo "Existing Payload found, packing into IPA directly..."
              zip -r build/output/App.ipa Payload
              exit 0
            fi
            echo "::error::No Xcode project, workspace, or Payload directory found in repository."
            exit 1
          fi

          SCHEME="MySampleApp"
          DETECTED_SCHEME=$(xcodebuild $BUILD_TARGET -list -json 2>/dev/null | plutil -extract project.schemes.0 raw - 2>/dev/null || echo "$SCHEME")
          if [ -n "$DETECTED_SCHEME" ] && [ "$DETECTED_SCHEME" != "$SCHEME" ]; then
            echo "Using detected scheme: $DETECTED_SCHEME"
            SCHEME="$DETECTED_SCHEME"
          fi

          echo "Archiving with scheme: $SCHEME"
          xcodebuild clean archive \
            $BUILD_TARGET \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/App.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="${CODE_SIGN_IDENTITY}" \
            PROVISIONING_PROFILE="${PROVISIONING_PROFILE_UUID}" \
            PROVISIONING_PROFILE_SPECIFIER="${PROVISIONING_PROFILE_UUID}" \
            DEVELOPMENT_TEAM="${DEVELOPMENT_TEAM}" \
            OTHER_CODE_SIGN_FLAGS="--keychain ${KEYCHAIN_PATH}" \
            COMPILER_INDEX_STORE_ENABLE=NO

          echo "Exporting IPA..."
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/output \
            -allowProvisioningUpdates

          ls -la build/output/
          IPA_FILE=$(find build/output -name "*.ipa" | head -n 1)
          if [ -z "$IPA_FILE" ]; then
            echo "::error::No IPA file found in build/output!"
            exit 1
          fi
          echo "Successfully generated IPA at: $IPA_FILE"
          echo "IPA_PATH=$IPA_FILE" >> $GITHUB_ENV

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-ipa-build
          path: build/output/*.ipa
          retention-days: 14

      - name: Create GitHub Release with IPA
        id: create_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          IPA_PATH=$(find build/output -name "*.ipa" | head -n 1)
          IPA_NAME=$(basename "$IPA_PATH")

          gh release create "$TAG" "$IPA_PATH" \
            --title "iOS Build ${TAG}" \
            --notes "Tự động build thành công bằng IPA AutoBuilder. File đính kèm: ${IPA_NAME}" \
            --latest || true

          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG}"
          echo "RELEASE_URL=$RELEASE_URL" >> $GITHUB_ENV
          echo "RELEASE_URL=$RELEASE_URL" >> $GITHUB_OUTPUT
